<!DOCTYPE html>
<html>
<head>
  <title>Saree Sales Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="style.css"> <!-- optional -->
</head>
<body>
  <h2>Scan Saree QR Code</h2>
  <div id="reader" style="width:300px;"></div>

  <form id="saleForm" style="display:none;">
    <label>ID NUMBER: <input type="text" id="idNumber" readonly></label><br>
    <label>DATE: <input type="text" id="date" readonly></label><br>
    <label>Customer Name: <input type="text" id="customerName"></label><br>
    <label>Customer Phone: <input type="text" id="customerPhone"></label><br>
    <label>Quantity Sold: <input type="number" id="qty"></label><br>
    <label>Sold Rate: <input type="number" id="rate"></label><br>
    <button type="button" onclick="submitSale()">Submit Sale</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
